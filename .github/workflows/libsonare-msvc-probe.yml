name: libsonare MSVC Analysis Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout TuneRite toolchain context
        uses: actions/checkout@v4

      - name: Checkout pinned libsonare source
        uses: actions/checkout@v4
        with:
          repository: libraz/libsonare
          ref: 8c5c637b06551a647d6f920525d146aecaa0831a
          path: libsonare
          fetch-depth: 1

      - name: Configure analysis-only libsonare with MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake -S libsonare -B build-libsonare-msvc -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=OFF -DBUILD_CLI=OFF -DBUILD_BENCH=OFF `
            -DBUILD_MASTERING=OFF -DBUILD_MIXING=OFF -DBUILD_GRAPH=OFF `
            -DBUILD_FX=OFF -DBUILD_ACOUSTIC_SIM=OFF -DBUILD_VOICE_CHANGER=OFF `
            -DBUILD_ARRANGEMENT=OFF -DBUILD_ASSIST=OFF -DSONARE_WITH_FFMPEG=OFF `
            *>&1 | Tee-Object -FilePath libsonare-msvc-probe.log
          $exitCode = $LASTEXITCODE
          Add-Content -Path libsonare-msvc-probe.log -Value "CMake exit code: $exitCode"
          exit $exitCode

      - name: Upload MSVC probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libsonare-msvc-probe-log
          path: libsonare-msvc-probe.log
          if-no-files-found: error
