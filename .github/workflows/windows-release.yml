name: KeyBridge Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE 7.0.12
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.12
          path: KeyBridge-Windows-CI-0.1.1/JUCE
          fetch-depth: 1

      - name: Set up bundled analyzer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build local reference analyzer beta runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reference = Join-Path $PWD "reference-analyzer"
          git clone --depth 1 https://github.com/libraz/bpm-detector.git $reference
          Push-Location $reference
          try {
            git fetch --depth 1 origin 9e82ed544edd7f06a5459b8fa8fe539f20335df8
            git checkout --detach 9e82ed544edd7f06a5459b8fa8fe539f20335df8
            if ((git rev-parse HEAD).Trim() -ne "9e82ed544edd7f06a5459b8fa8fe539f20335df8") { throw "Unexpected bpm-detector revision" }
            python -m pip install --disable-pip-version-check --no-input . pyinstaller
            $wrapper = Join-Path $PWD "..\KeyBridge-Windows-CI-0.1.1\Tools\TuneRiteReferenceAnalyzer.py"
            python -m PyInstaller --noconfirm --clean --onedir --name TuneRiteReferenceAnalyzer --paths "$reference\src" --add-data "$reference\src\bpm_detector;bpm_detector" --collect-all bpm_detector --collect-all librosa --collect-all scipy --collect-all sklearn --collect-all soundfile --collect-all resampy --collect-all audioread $wrapper
          } finally {
            Pop-Location
          }
          $runtime = Join-Path $reference "dist\TuneRiteReferenceAnalyzer"
          $runtimeExe = Join-Path $runtime "TuneRiteReferenceAnalyzer.exe"
          if (!(Test-Path -LiteralPath $runtimeExe)) { throw "Bundled local analyzer executable was not produced: $runtimeExe" }
          $fixtures = Join-Path $PWD "reference-analyzer-fixtures"
          python "KeyBridge-Windows-CI-0.1.1/Tests/generate_synthetic_fixtures.py" --output $fixtures
          & $runtimeExe --input (Join-Path $fixtures "c_eg_click_120bpm.wav") --output (Join-Path $fixtures "runtime-check.json")
          if ($LASTEXITCODE -ne 0) { throw "Bundled local analyzer execution failed with exit code $LASTEXITCODE" }
          $runtimeResult = Get-Content -LiteralPath (Join-Path $fixtures "runtime-check.json") -Raw | ConvertFrom-Json
          if ($runtimeResult.schema_version -ne 1 -or $runtimeResult.tempo.valid -ne $true -or [math]::Abs($runtimeResult.tempo.bpm - 120.0) -gt 1.0) { throw "Bundled local analyzer returned an invalid 120 BPM fixture result" }
          "TUNERITE_REFERENCE_ANALYZER=$runtimeExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSVC x64 Release
        shell: pwsh
        run: |
          $project = "KeyBridge-Windows-CI-0.1.1"
          Copy-Item "$project/CMakeLists-msvc.txt" "$project/CMakeLists.txt" -Force
          cmake -S $project -B build-msvc -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build-msvc --config Release --target Tunerite_VST3 --parallel
          if ($LASTEXITCODE -ne 0) { throw "MSVC VST3 build failed with exit code $LASTEXITCODE" }
          $vst3 = "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3"
          if (!(Test-Path $vst3)) { throw "VST3 bundle was not produced at $vst3" }

      - name: Build and test shared analysis core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build-msvc --config Release --target TuneriteOfflineAnalyzer TuneriteAnalysisCoreSyntheticTests TuneriteProcessorCaptureTests TuneriteVocalFitTests TuneriteLocalReferenceAnalyzerTests --parallel
          if ($LASTEXITCODE -ne 0) { throw "Offline analyzer, shared-core test, processor-capture test, or Vocal Fit test build failed with exit code $LASTEXITCODE" }
          $reports = [System.IO.Path]::GetFullPath((Join-Path $PWD "build-msvc/offline-reports"))
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $test = Get-ChildItem "build-msvc" -Recurse -File -Filter "TuneriteAnalysisCoreSyntheticTests.exe" | Select-Object -First 1
          if ($null -eq $test) { throw "Shared AnalysisCore synthetic test executable was not produced" }
          Push-Location $reports
          try {
            & $test.FullName
            $testExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($testExit -ne 0) { throw "Shared AnalysisCore synthetic regression test failed with exit code $testExit; inspect build-msvc/offline-reports/analysis-core-synthetic-results.json" }
          $captureTest = Get-ChildItem "build-msvc" -Recurse -File -Filter "TuneriteProcessorCaptureTests.exe" | Select-Object -First 1
          if ($null -eq $captureTest) { throw "Processor capture test executable was not produced" }
          $captureLog = Join-Path $reports "processor-capture-test.log"
          & $captureTest.FullName 2>&1 | Tee-Object -FilePath $captureLog
          $captureExit = $LASTEXITCODE
          if ($captureExit -ne 0) { throw "Beat/Vocal processor capture regression failed with exit code $captureExit; inspect $captureLog" }
          $localAnalyzerTest = Get-ChildItem "build-msvc" -Recurse -File -Filter "TuneriteLocalReferenceAnalyzerTests.exe" | Select-Object -First 1
          if ($null -eq $localAnalyzerTest) { throw "Local analyzer adapter test executable was not produced" }
          $localAnalyzerLog = Join-Path $reports "local-reference-analyzer-test.log"
          & $localAnalyzerTest.FullName 2>&1 | Tee-Object -FilePath $localAnalyzerLog
          $localAnalyzerExit = $LASTEXITCODE
          if ($localAnalyzerExit -ne 0) { throw "Local analyzer adapter regression failed with exit code $localAnalyzerExit; inspect $localAnalyzerLog" }
          $vocalFitTest = Get-ChildItem "build-msvc" -Recurse -File -Filter "TuneriteVocalFitTests.exe" | Select-Object -First 1
          if ($null -eq $vocalFitTest) { throw "Vocal Fit test executable was not produced" }
          $vocalFitLog = Join-Path $reports "vocal-fit-test.log"
          & $vocalFitTest.FullName 2>&1 | Tee-Object -FilePath $vocalFitLog
          $vocalFitExit = $LASTEXITCODE
          if ($vocalFitExit -ne 0) { throw "Vocal Fit regression failed with exit code $vocalFitExit; inspect $vocalFitLog" }

      - name: Validate offline WAV analyzer reports
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildRoot = [System.IO.Path]::GetFullPath((Join-Path $PWD "build-msvc"))
          $fixturesDirectory = Join-Path $buildRoot "synthetic-fixtures"
          $reportsDirectory = Join-Path $buildRoot "offline-reports"
          New-Item -ItemType Directory -Force -Path $fixturesDirectory, $reportsDirectory | Out-Null
          $validationLogPath = Join-Path $reportsDirectory "validation.log"
          Start-Transcript -Path $validationLogPath -Force | Out-Null
          try {
            $analyzer = Join-Path $buildRoot "TuneriteOfflineAnalyzer_artefacts/Release/TuneriteOfflineAnalyzer.exe"
            if (!(Test-Path -LiteralPath $analyzer)) { throw "Offline analyzer executable was not produced: $analyzer" }
            python "KeyBridge-Windows-CI-0.1.1/Tests/generate_synthetic_fixtures.py" --output $fixturesDirectory
            if ($LASTEXITCODE -ne 0) { throw "Synthetic WAV fixture generation failed with exit code $LASTEXITCODE" }

            function Assert-ReportExists([string] $reportPath, [string] $label) {
              if (Test-Path -LiteralPath $reportPath -PathType Leaf) { return }
              Write-Host "Missing $label report: $reportPath"
              Write-Host "Current working directory: $(Get-Location)"
              Write-Host "JSON files beneath build root ($buildRoot):"
              Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter *.json -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host $_.FullName }
              throw "$label report was not created at the expected absolute path: $reportPath"
            }

            $beatReportPath = [System.IO.Path]::GetFullPath((Join-Path $reportsDirectory "c_eg_click_120bpm.json"))
            Write-Host "Beat report absolute path: $beatReportPath"
            & $analyzer --input (Join-Path $fixturesDirectory "c_eg_click_120bpm.wav") --mode beat --output $beatReportPath
            if ($LASTEXITCODE -ne 0) { throw "Offline beat WAV analysis failed with exit code $LASTEXITCODE" }
            Assert-ReportExists $beatReportPath "beat"
            $beat = Get-Content -LiteralPath $beatReportPath -Raw | ConvertFrom-Json
            Write-Host "Beat JSON: BPM=$($beat.detected_bpm), key_root=$($beat.key_root), key_mode=$($beat.key_mode), key_confidence=$($beat.key_confidence), bpm_confidence=$($beat.bpm_confidence), key_uncertain=$($beat.key_uncertain)"
            if ([math]::Abs($beat.detected_bpm - 120.0) -gt 1.0) { throw "Offline beat report BPM was $($beat.detected_bpm), expected local analyzer 120 +/- 1.0" }
            if ($beat.key_valid -ne $true -or $beat.key_root -lt 0 -or $beat.key_mode -notin @(0, 1)) { throw "Local analyzer must return a structurally valid audio-derived key or report it uncertain" }

            $vocalReportPath = [System.IO.Path]::GetFullPath((Join-Path $reportsDirectory "a3_220hz.json"))
            Write-Host "Vocal report absolute path: $vocalReportPath"
            & $analyzer --input (Join-Path $fixturesDirectory "a3_220hz.wav") --mode vocal --output $vocalReportPath
            if ($LASTEXITCODE -ne 0) { throw "Offline vocal WAV analysis failed with exit code $LASTEXITCODE" }
            Assert-ReportExists $vocalReportPath "vocal"
            $vocal = Get-Content -LiteralPath $vocalReportPath -Raw | ConvertFrom-Json
            Write-Host "Vocal JSON: average_midi=$($vocal.average_midi), low_midi=$($vocal.low_midi), high_midi=$($vocal.high_midi), confidence=$($vocal.confidence), voiced_percent=$($vocal.voiced_percent), melodic=$($vocal.melodic)"
            if ([math]::Abs($vocal.average_midi - 57.0) -gt 0.5) { throw "Offline vocal report MIDI was $($vocal.average_midi), expected A3/MIDI 57 +/- 0.5" }

            foreach ($rejectionCase in @(
              @{ label = "silence"; input = "silence.wav"; report = "silence.json" },
              @{ label = "low-level noise"; input = "low_level_noise.wav"; report = "low_level_noise.json" }
            )) {
              $rejectionReportPath = [System.IO.Path]::GetFullPath((Join-Path $reportsDirectory $rejectionCase.report))
              Write-Host "$($rejectionCase.label) report absolute path: $rejectionReportPath"
              & $analyzer --input (Join-Path $fixturesDirectory $rejectionCase.input) --mode beat --output $rejectionReportPath
              if ($LASTEXITCODE -ne 0) { throw "Offline $($rejectionCase.label) analysis failed with exit code $LASTEXITCODE" }
              Assert-ReportExists $rejectionReportPath $rejectionCase.label
              $rejection = Get-Content -LiteralPath $rejectionReportPath -Raw | ConvertFrom-Json
              Write-Host "$($rejectionCase.label) JSON: usable_audio=$($rejection.usable_audio), BPM=$($rejection.detected_bpm), key_uncertain=$($rejection.key_uncertain), bpm_uncertain=$($rejection.bpm_uncertain), warning=$($rejection.warning)"
              if ($rejection.usable_audio -ne $false -or $rejection.detected_bpm -ne 0 -or $rejection.key_uncertain -ne $true -or $rejection.bpm_uncertain -ne $true) {
                throw "$($rejectionCase.label) must be rejected without a BPM/key result"
              }
            }
          }
          finally {
            Stop-Transcript | Out-Null
          }

      - name: Upload offline validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tunerite-Offline-Validation-Reports
          path: build-msvc/offline-reports
          if-no-files-found: warn

      - name: Normalize and validate VST3 manifest
        shell: pwsh
        run: |
          $manifest = "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3/Contents/Resources/moduleinfo.json"
          if (!(Test-Path $manifest)) { throw "VST3 moduleinfo.json was not produced at $manifest" }
          $raw = Get-Content $manifest -Raw
          $strict = [regex]::Replace($raw, ',(?=\s*[}\]])', '')
          Set-Content -Path $manifest -Value $strict -Encoding utf8NoBOM
          try {
            $null = $strict | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "moduleinfo.json is not valid strict JSON: $($_.Exception.Message)"
          }
          Write-Host "Validated strict JSON manifest: $manifest"

      - name: Verify VST3 exports
        shell: pwsh
        run: |
          $binary = "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3/Contents/x86_64-win/Tunerite.vst3"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsroot\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin.exe was not found on the Windows runner" }
          $exports = & $dumpbin.FullName /exports $binary | Out-String
          foreach ($name in @("InitDll", "GetPluginFactory", "ExitDll")) {
            if ($exports -notmatch $name) { throw "Required VST3 export missing: $name" }
          }
          Write-Host "Verified VST3 exports: InitDll, GetPluginFactory, ExitDll"

      - name: Stage installer payload
        shell: pwsh
        run: |
          $project = "KeyBridge-Windows-CI-0.1.1"
          $stage = "$project/installer/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Remove-Item "$stage/Tunerite.vst3" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3" "$stage/Tunerite.vst3"
          Copy-Item "$project/README.md" "$stage/README.txt" -Force
          $runtime = "reference-analyzer/dist/TuneRiteReferenceAnalyzer"
          if (!(Test-Path "$runtime/TuneRiteReferenceAnalyzer.exe")) { throw "Local analyzer runtime missing from expected build output" }
          Remove-Item "$stage/ReferenceAnalyzer" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse $runtime "$stage/ReferenceAnalyzer"
          if (!(Test-Path "$stage/Tunerite.vst3/Contents/x86_64-win/Tunerite.vst3")) { throw "Complete x86_64 VST3 binary is missing from staged bundle" }
          if (!(Test-Path "$stage/Tunerite.vst3/Contents/Resources")) { throw "VST3 Resources directory is missing from staged bundle" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "KeyBridge-Windows-CI-0.1.1/installer/KeyBridge.iss"
          if (!(Test-Path "dist/Tunerite-Setup-0.1.1.exe")) { throw "Expected installer dist/Tunerite-Setup-0.1.1.exe was not produced" }

      - name: Package VST3 bundles
        shell: pwsh
        run: |
          $bundle = "KeyBridge-Windows-CI-0.1.1/installer/stage/Tunerite.vst3"
          Compress-Archive -Path $bundle -DestinationPath "dist/Tunerite-VST3-Bundle-0.1.1.zip" -Force
          $noManifest = "dist/Tunerite.vst3-no-manifest"
          Copy-Item -Recurse $bundle $noManifest -Force
          Remove-Item "$noManifest/Contents/Resources/moduleinfo.json" -Force
          Compress-Archive -Path $noManifest -DestinationPath "dist/Tunerite-VST3-Bundle-NoManifest-0.1.1.zip" -Force
          Remove-Item $noManifest -Recurse -Force
          if (!(Test-Path "dist/Tunerite-VST3-Bundle-0.1.1.zip")) { throw "Expected strict-manifest VST3 bundle ZIP was not produced" }
          if (!(Test-Path "dist/Tunerite-VST3-Bundle-NoManifest-0.1.1.zip")) { throw "Expected no-manifest VST3 bundle ZIP was not produced" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Tunerite-Windows-Packages-0.1.1
          path: |
            dist/Tunerite-Setup-0.1.1.exe
            dist/Tunerite-VST3-Bundle-0.1.1.zip
            dist/Tunerite-VST3-Bundle-NoManifest-0.1.1.zip
          if-no-files-found: error
