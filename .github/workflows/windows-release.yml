name: KeyBridge Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE 7.0.12
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.12
          path: KeyBridge-Windows-CI-0.1.1/JUCE
          fetch-depth: 1

      - name: Configure MSVC x64 Release
        shell: pwsh
        run: |
          $project = "KeyBridge-Windows-CI-0.1.1"
          Copy-Item "$project/CMakeLists-msvc.txt" "$project/CMakeLists.txt" -Force
          cmake -S $project -B build-msvc -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build-msvc --config Release --target Tunerite_VST3 --parallel
          if ($LASTEXITCODE -ne 0) { throw "MSVC VST3 build failed with exit code $LASTEXITCODE" }
          $vst3 = "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3"
          if (!(Test-Path $vst3)) { throw "VST3 bundle was not produced at $vst3" }

      - name: Build and test shared analysis core
        shell: pwsh
        run: |
          cmake --build build-msvc --config Release --target TuneriteOfflineAnalyzer TuneriteAnalysisCoreSyntheticTests --parallel
          if ($LASTEXITCODE -ne 0) { throw "Offline analyzer or synthetic test build failed with exit code $LASTEXITCODE" }
          ctest --test-dir build-msvc -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Shared AnalysisCore synthetic regression test failed" }

      - name: Validate offline WAV analyzer reports
        shell: pwsh
        run: |
          $fixtures = "build-msvc/synthetic-fixtures"
          $reports = "build-msvc/offline-reports"
          python "KeyBridge-Windows-CI-0.1.1/Tests/generate_synthetic_fixtures.py" --output $fixtures
          $analyzer = "build-msvc/TuneriteOfflineAnalyzer_artefacts/Release/TuneriteOfflineAnalyzer.exe"
          if (!(Test-Path $analyzer)) { throw "Offline analyzer executable was not produced" }
          & $analyzer --input "$fixtures/c_eg_click_120bpm.wav" --mode beat --output "$reports/c_eg_click_120bpm"
          if ($LASTEXITCODE -ne 0) { throw "Offline beat WAV analysis failed" }
          $beat = Get-Content "$reports/c_eg_click_120bpm.json" -Raw | ConvertFrom-Json
          if ([math]::Abs($beat.detected_bpm - 120.0) -gt 2.0) { throw "Offline beat report BPM was $($beat.detected_bpm), expected 120 +/- 2" }
          if ($beat.key_uncertain -ne $true) { throw "C-E-G relative-mode fixture must remain explicitly key-uncertain" }
          & $analyzer --input "$fixtures/a3_220hz.wav" --mode vocal --output "$reports/a3_220hz"
          if ($LASTEXITCODE -ne 0) { throw "Offline vocal WAV analysis failed" }
          $vocal = Get-Content "$reports/a3_220hz.json" -Raw | ConvertFrom-Json
          if ([math]::Abs($vocal.average_midi - 57.0) -gt 0.5) { throw "Offline vocal report MIDI was $($vocal.average_midi), expected A3/MIDI 57 +/- 0.5" }
          Write-Host "Validated offline WAV reports: beat BPM=$($beat.detected_bpm), vocal MIDI=$($vocal.average_midi)"

      - name: Normalize and validate VST3 manifest
        shell: pwsh
        run: |
          $manifest = "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3/Contents/Resources/moduleinfo.json"
          if (!(Test-Path $manifest)) { throw "VST3 moduleinfo.json was not produced at $manifest" }
          $raw = Get-Content $manifest -Raw
          $strict = [regex]::Replace($raw, ',(?=\s*[}\]])', '')
          Set-Content -Path $manifest -Value $strict -Encoding utf8NoBOM
          try {
            $null = $strict | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "moduleinfo.json is not valid strict JSON: $($_.Exception.Message)"
          }
          Write-Host "Validated strict JSON manifest: $manifest"

      - name: Verify VST3 exports
        shell: pwsh
        run: |
          $binary = "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3/Contents/x86_64-win/Tunerite.vst3"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsroot\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin.exe was not found on the Windows runner" }
          $exports = & $dumpbin.FullName /exports $binary | Out-String
          foreach ($name in @("InitDll", "GetPluginFactory", "ExitDll")) {
            if ($exports -notmatch $name) { throw "Required VST3 export missing: $name" }
          }
          Write-Host "Verified VST3 exports: InitDll, GetPluginFactory, ExitDll"

      - name: Stage installer payload
        shell: pwsh
        run: |
          $project = "KeyBridge-Windows-CI-0.1.1"
          $stage = "$project/installer/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Remove-Item "$stage/Tunerite.vst3" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse "build-msvc/Tunerite_artefacts/Release/VST3/Tunerite.vst3" "$stage/Tunerite.vst3"
          Copy-Item "$project/README.md" "$stage/README.txt" -Force
          if (!(Test-Path "$stage/Tunerite.vst3/Contents/x86_64-win/Tunerite.vst3")) { throw "Complete x86_64 VST3 binary is missing from staged bundle" }
          if (!(Test-Path "$stage/Tunerite.vst3/Contents/Resources")) { throw "VST3 Resources directory is missing from staged bundle" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "KeyBridge-Windows-CI-0.1.1/installer/KeyBridge.iss"
          if (!(Test-Path "dist/Tunerite-Setup-0.1.1.exe")) { throw "Expected installer dist/Tunerite-Setup-0.1.1.exe was not produced" }

      - name: Package VST3 bundles
        shell: pwsh
        run: |
          $bundle = "KeyBridge-Windows-CI-0.1.1/installer/stage/Tunerite.vst3"
          Compress-Archive -Path $bundle -DestinationPath "dist/Tunerite-VST3-Bundle-0.1.1.zip" -Force
          $noManifest = "dist/Tunerite.vst3-no-manifest"
          Copy-Item -Recurse $bundle $noManifest -Force
          Remove-Item "$noManifest/Contents/Resources/moduleinfo.json" -Force
          Compress-Archive -Path $noManifest -DestinationPath "dist/Tunerite-VST3-Bundle-NoManifest-0.1.1.zip" -Force
          Remove-Item $noManifest -Recurse -Force
          if (!(Test-Path "dist/Tunerite-VST3-Bundle-0.1.1.zip")) { throw "Expected strict-manifest VST3 bundle ZIP was not produced" }
          if (!(Test-Path "dist/Tunerite-VST3-Bundle-NoManifest-0.1.1.zip")) { throw "Expected no-manifest VST3 bundle ZIP was not produced" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Tunerite-Windows-Packages-0.1.1
          path: |
            dist/Tunerite-Setup-0.1.1.exe
            dist/Tunerite-VST3-Bundle-0.1.1.zip
            dist/Tunerite-VST3-Bundle-NoManifest-0.1.1.zip
          if-no-files-found: error
